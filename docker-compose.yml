services:
  app:
    image: ghcr.io/lawndlwd/quizz:latest
    restart: unless-stopped
    ports:
      # APP_BIND=127.0.0.1 keeps the app reachable only through a reverse proxy.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    environment:
      - DATA_DIR=/data
      # Set these in a .env file next to this compose file. No insecure defaults:
      # the app refuses to start without a strong JWT_SECRET, and seeds a random
      # admin password (printed once in the logs) if ADMIN_PASSWORD is unset.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      - ALLOWED_DOMAIN=${ALLOWED_DOMAIN:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY:-}
      - GIPHY_API_KEY=${GIPHY_API_KEY:-}
    volumes:
      - ./data:/data
      - ./avatars:/data/avatars

  # Optional HTTPS for a server dedicated to Quizz. Start with: --profile caddy
  # Skip it if the server already has a reverse proxy.
  caddy:
    image: caddy:latest
    restart: unless-stopped
    profiles:
      - caddy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Passed only when set: without it, Caddy serves plain HTTP on port 80.
      - DOMAIN
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
