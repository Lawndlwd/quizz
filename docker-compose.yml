services:
  app:
    image: ghcr.io/lawndlwd/quizz:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DATA_DIR=/data
      # Set these in a .env file next to this compose file. No insecure defaults:
      # the app refuses to start without a strong JWT_SECRET, and seeds a random
      # admin password (printed once in the logs) if ADMIN_PASSWORD is unset.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      - ALLOWED_DOMAIN=${ALLOWED_DOMAIN:-}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY:-}
      - GIPHY_API_KEY=${GIPHY_API_KEY:-}
    volumes:
      - ./data:/data
      - ./avatars:/data/avatars

  caddy:
    image: caddy:latest
    restart: unless-stopped
    profiles:
      - caddy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DATA_DIR: /data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}

    volumes:
      - quizz_data:/data
      - quizz_avatars:/data/avatars

volumes:
  quizz_data:
  quizz_avatars:
